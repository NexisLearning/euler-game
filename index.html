<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euler Game</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" type="module"></script>
</head>
<body>
    <div class="world" data-world style="position: relative; width: 100vw; height: 100vh; overflow: hidden;">
        <div class="score" data-score style="
            position: absolute; 
            top: 20px; 
            right: 30px; 
            font-size: 4rem; 
            font-weight: bold; 
            font-family: sans-serif; 
            color: #333; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            z-index: 100;">
            0
        </div>
  <div class="world" data-world>
    <div class="score" data-score>0</div>
    <div class="start-screen" data-start-screen>Press Any Key To Start</div>
    <img src="imgs/ground.png" class="ground" data-ground>
    <img src="imgs/ground.png" class="ground" data-ground>
    <img src="imgs/dino-stationary.png" class="dino" data-dino>
  </div>
</body>
</html>
